plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.uniconecta"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.uniconecta"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            //signingConfig = signingConfigs.debug // Esta era la línea original
            signingConfig signingConfigs.release
            minifyEnabled true
            //useProguard true //esto ya no aplica
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    //Este bloque es para personalizar el nombre de los archivos .aab y .apk
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def appName = "Uniconecta" // ← ¡PON AQUÍ EL NOMBRE QUE QUIERAS!
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def versionCode = variant.versionCode

            if (buildType == "release") {
                if (output.outputFileName.endsWith('.aab')) {
                    output.outputFileName = "${appName}_v${versionName}(${versionCode})_release.aab"
                } else if (output.outputFileName.endsWith('.apk')) {
                    output.outputFileName = "${appName}_v${versionName}(${versionCode})_release.apk"
                }
            } else if (buildType == "debug") {
                output.outputFileName = "${appName}_debug.apk"
            }
        }
    }
}

flutter {
    source = "../.."
}
